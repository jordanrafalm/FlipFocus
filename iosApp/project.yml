name: FlipFocus
options:
  bundleIdPrefix: pl.flipfocus
  deploymentTarget:
    iOS: "16.2"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "11.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: "7.1.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "4"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Only iosArm64/iosSimulatorArm64 KMP targets exist (no iosX64); without this, a bare
    # `-sdk iphonesimulator` build (no -destination) defaults ARCHS to "arm64 x86_64" and
    # syncComposeResourcesForIos fails to resolve resources for the missing x86_64 arch.
    ARCHS: arm64
    VALID_ARCHS: arm64
targets:
  FlipFocus:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.flipfocus.app
        INFOPLIST_FILE: iosApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework ComposeApp"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        TARGETED_DEVICE_FAMILY: "1,2"
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    dependencies:
      - target: FocusWidgetExtension
        embed: true
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
    preBuildScripts:
      - name: Build shared Kotlin framework
        script: |
          cd "$SRCROOT/.."
          # --no-daemon: a reused Gradle daemon keeps the env captured at its first launch, so it can
          # miss the SDK_NAME/PLATFORM_NAME/CONFIGURATION Xcode exports for this build and fail with
          # "Could not infer iOS target platform". A fresh per-build JVM always sees the current env.
          ./gradlew --no-daemon :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
  FocusWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: FocusWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.flipfocus.app.FocusWidget
        INFOPLIST_FILE: FocusWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
schemes:
  FlipFocus:
    build:
      targets:
        FlipFocus: all
        FocusWidgetExtension: all
    run:
      config: Debug

